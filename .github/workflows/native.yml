name: Native build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Account and ranking gateway checks
        run: make check
      - name: Compile macOS app (CI only; not a distributable artifact)
        run: xcodebuild -project Tero.xcodeproj -scheme 'Tero Dev' -destination 'generic/platform=macOS' -derivedDataPath /tmp/tero-ci CODE_SIGNING_ALLOWED=NO build -quiet
